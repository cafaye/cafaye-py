# Toolchain pins for this repository. The worktree and CI must agree, so the
# versions live here rather than in whatever the machine happens to have
# installed.
#
#   mise install        # install the pinned toolchain
#   mise run prime      # the fleet's spelling of the gate: install, format, lint,
#                       # typecheck, tests, coverage
#   mise run gate       # an alias for the same file. One gate under two names is
#                       # one gate, not two.
#   ./bin/prime         # the file itself, which is what CI runs
#
# WHY THESE NUMBERS
#   - python 3.14.7 is what `pyproject.toml`'s dev group is resolved and tested
#     against locally. It is the newest interpreter this machine's mise offers,
#     and a client that only runs on the newest interpreter has never been
#     tested on any other. `requires-python` says ">=3.11" and CI runs the gate
#     on 3.11, 3.12, 3.13 and 3.14; this pin is the *development* interpreter, not
#     the only supported one.
#   - uv 0.12.20 is pinned rather than ranged, for the same reason
#     `cafaye-ts` pins its generator exactly: the resolver is part of the build.
#     A `uv.lock` is only a lock if the resolver that produced it is known.
#
# There is no separate `pytest`/`mypy`/`ruff` pin HERE. Those are dev
# dependencies in `pyproject.toml` and are pinned there by `uv.lock`, which is
# the file that actually decides what runs. A toolchain pin in mise and a
# dependency pin in a manifest are two different facts — duplicating the number
# here would create a second copy to keep in sync for no additional guarantee.

[tools]
python = "3.14.7"
uv = "0.12.20"

# WHY `run` NAMES A FILE AND NOT A COMMAND LINE
# ---------------------------------------------
# Both gate tasks run `./bin/prime` and nothing else — no pipes, no `&&`, no
# `cd`. That is not a style preference, it is what lets `gate.yml`'s checker
# resolve the task to a file on disk and compare it with the declared
# entrypoint: a `run` string containing a shell operator is a string the checker
# has to hand to a shell to understand, and it reports `gate.task-unreadable`
# rather than a verdict. It was worse than that before cafaye-py-10: this table
# read `run = "./bin/gate"`, and `bin/gate` has never existed in this
# repository, so `mise run gate` — the one gate spelling mise advertised, and the
# one this file's own header used to recommend — died with
# `sh: ./bin/gate: No such file or directory`. See REPORT-cafaye-py-10-gate.md.

[tasks.prime]
description = "The gate: format, lint, typecheck, the full test suite, the coverage check"
run = "./bin/prime"

[tasks.gate]
description = "An alias for `mise run prime`. The same file, so this is one gate with two names."
run = "./bin/prime"

[tasks.test]
description = "The test suite with coverage, no gate"
run = "uv run pytest"

[tasks.typecheck]
description = "mypy over the package and the tests"
run = "uv run mypy"